[project]
name = "hotel-rag-assistant"
version = "0.1.0"
description = "A hotel assistant that answers from PDF documentation with retrieval-augmented generation: local models, cited sources, built-in evaluation."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Morissala2001" }]
dependencies = [
    "numpy>=2.0",
    "pypdf>=6.14",
    "sentence-transformers>=5.6",
    "torch>=2.11",
    "transformers>=5.13",
]

[project.optional-dependencies]
app = ["streamlit>=1.65"]

[project.scripts]
hotel-rag = "hotel_rag.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotel_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads the real models (set HOTEL_RAG_RUN_SLOW=1 to run)"]
