[project]
name = "hotel-rag-assistant"
version = "0.1.0"
description = "A hotel assistant that answers from PDF documentation with retrieval-augmented generation: local models, cited sources, built-in evaluation."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Morissala2001" }]
dependencies = [
    "numpy>=2.0",
    "pypdf>=6.14",
    "sentence-transformers>=5.6",
    "torch>=2.11",
    "transformers>=5.13",
]

[project.optional-dependencies]
app = ["streamlit>=1.65"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
hotel-rag = "hotel_rag.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "httpx2>=2.13"]  # httpx2: FastAPI's test client

# On Linux (CI, Docker), the CPU build of PyTorch: no GPU is used, and PyPI's build pulls about 3 GB
# of CUDA libraries. Windows and macOS get the CPU build from PyPI anyway.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotel_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads the real models (set HOTEL_RAG_RUN_SLOW=1 to run)"]
